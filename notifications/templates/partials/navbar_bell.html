<div class="dropdown" id="notificationWidget" data-recent-url="{% url 'notifications:recent_api' %}" data-mark-url="{% url 'notifications:mark_read' 0 %}" data-delete-url="{% url 'notifications:delete' 0 %}" data-mark-all-url="{% url 'notifications:mark_all' %}">
  <button class="btn position-relative" id="notifBell" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-label="Notifications" aria-expanded="false"><i class="fas fa-bell" aria-hidden="true"></i><span id="notifBadge" class="badge bg-danger position-absolute top-0 end-0" hidden>0</span></button>
  <div class="dropdown-menu dropdown-menu-end p-0 shadow" style="width:min(380px,90vw)">
    <div class="d-flex justify-content-between border-bottom p-3"><strong>Notifications</strong><button class="btn btn-sm btn-link" data-notification-action="all">Mark all read</button></div>
    <div id="notifDropdown" style="max-height:380px;overflow-y:auto"><div class="p-3 text-muted">Loading notifications…</div></div>
    <a class="d-block text-center p-3 border-top" href="{% url 'notifications:list' %}">Open notification center</a>
    <div id="notificationError" class="small text-danger px-3" role="status"></div>
  </div>
  <input type="hidden" id="notificationCsrf" value="{{ csrf_token }}">
</div>
{% load static %}<script src="{% static 'crm/js/notifications.js' %}" defer></script>
