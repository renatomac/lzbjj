{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>LZBJJ Fight Timer · TV</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <!-- Ably client library -->
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        :root {
            --red:     #e8001c;
            --red-dim: #7a000e;
            --gold:    #c8960c;
            --white:   #f0ece4;
            --dark:    #080608;
            --mid:     #110d10;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: var(--dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Bebas Neue', sans-serif;
            position: relative;
        }

        .bg-logo {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 0;
        }
        .bg-logo img {
            width: min(72vw, 72vh);
            height: auto;
            opacity: 0.07;
            filter: grayscale(1) brightness(2);
            animation: logoPulse 8s ease-in-out infinite alternate;
        }
        @keyframes logoPulse {
            0%   { opacity: 0.05; transform: scale(1); }
            100% { opacity: 0.11; transform: scale(1.03); }
        }

        .vignette {
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center,
                transparent 30%,
                rgba(8,6,8,0.55) 65%,
                rgba(8,6,8,0.92) 100%);
            pointer-events: none;
            z-index: 1;
        }

        .scanlines {
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 3px,
                rgba(0,0,0,0.18) 3px,
                rgba(0,0,0,0.18) 4px
            );
            pointer-events: none;
            z-index: 2;
            animation: scanMove 12s linear infinite;
        }
        @keyframes scanMove {
            from { background-position: 0 0; }
            to   { background-position: 0 200px; }
        }

        .bracket {
            position: absolute;
            width: 60px;
            height: 60px;
            border-color: var(--red);
            border-style: solid;
            opacity: 0.5;
            z-index: 5;
        }
        .bracket.tl { top: 24px; left: 24px;  border-width: 3px 0 0 3px; }
        .bracket.tr { top: 24px; right: 24px;  border-width: 3px 3px 0 0; }
        .bracket.bl { bottom: 24px; left: 24px;  border-width: 0 0 3px 3px; }
        .bracket.br { bottom: 24px; right: 24px;  border-width: 0 3px 3px 0; }

        .h-line {
            position: absolute;
            left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--red-dim) 20%, var(--red) 50%, var(--red-dim) 80%, transparent);
            opacity: 0.35;
            z-index: 5;
        }
        .h-line.top    { top: 80px; }
        .h-line.bottom { bottom: 80px; }

        .stage {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0;
            width: 100%;
            padding: 0 4vw;
        }

        .phase-label {
            font-family: 'Oswald', sans-serif;
            font-size: clamp(1.8rem, 5vw, 4.5rem);
            font-weight: 700;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: var(--white);
            padding: 0.15em 1.4em;
            border-top: 2px solid currentColor;
            border-bottom: 2px solid currentColor;
            margin-bottom: 0.3em;
            transition: color 0.25s, border-color 0.25s, text-shadow 0.25s;
            text-shadow: 0 0 18px currentColor;
            position: relative;
        }
        .phase-label::before,
        .phase-label::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            border: 2px solid currentColor;
            top: 50%;
            transform: translateY(-50%) rotate(45deg);
        }
        .phase-label::before { left: -4px; }
        .phase-label::after  { right: -4px; }

        .phase-work  { color: #00e676; }
        .phase-rest  { color: var(--red); }
        .phase-ready { color: #888; }
        .phase-done  { color: var(--gold); }

        .timer-digits {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(14rem, 26vw, 28rem);
            line-height: 0.88;
            letter-spacing: 0.04em;
            color: var(--white);
            text-shadow:
                0 0 40px rgba(232,0,28,0.25),
                0 0 80px rgba(232,0,28,0.1),
                4px 4px 0px rgba(0,0,0,0.6);
            transition: color 0.2s, text-shadow 0.2s;
            position: relative;
        }

        .digits-work {
            color: #e8ffe8;
            text-shadow:
                0 0 40px rgba(0,230,118,0.3),
                0 0 80px rgba(0,230,118,0.15),
                4px 4px 0px rgba(0,0,0,0.6);
        }

        .digits-rest {
            color: #ffe8e8;
            text-shadow:
                0 0 40px rgba(232,0,28,0.5),
                0 0 100px rgba(232,0,28,0.2),
                4px 4px 0px rgba(0,0,0,0.6);
        }

        .digits-warning {
            color: var(--red) !important;
            text-shadow:
                0 0 20px #ff0020,
                0 0 60px #ff0020,
                0 0 120px rgba(255,0,32,0.4) !important;
            animation: warningFlash 0.6s ease-in-out infinite alternate;
        }
        @keyframes warningFlash {
            0%   { opacity: 0.8;  letter-spacing: 0.04em; }
            100% { opacity: 1;    letter-spacing: 0.06em; }
        }

        .round-info {
            font-family: 'Share Tech Mono', monospace;
            font-size: clamp(1rem, 2.8vw, 2.2rem);
            letter-spacing: 0.2em;
            color: #666;
            margin-top: 0.6em;
            text-transform: uppercase;
            transition: color 0.3s;
        }
        .round-info span {
            color: var(--gold);
        }

        .status-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 36px;
            background: rgba(8,6,8,0.85);
            border-top: 1px solid rgba(232,0,28,0.2);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 20;
        }
        .status-bar .dot {
            width: 7px; height: 7px;
            background: #444;
            border-radius: 50%;
            margin-right: 8px;
            transition: background 0.3s, box-shadow 0.3s;
            display: inline-block;
        }
        .status-bar .dot.live {
            background: #00e676;
            box-shadow: 0 0 6px #00e676;
            animation: dotBlink 2s ease-in-out infinite;
        }
        @keyframes dotBlink {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.4; }
        }
        .status-bar .label {
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            color: #555;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }
        .status-bar .label.live { color: #00e676; }
        .status-bar .brand {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 16px;
            letter-spacing: 0.2em;
            color: var(--red-dim);
        }

        .digits-done {
            background: linear-gradient(90deg, #c8960c, #ffe066, #c8960c);
            background-size: 200%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent !important;
            animation: goldShimmer 2s linear infinite;
        }
        @keyframes goldShimmer {
            from { background-position: 200% center; }
            to   { background-position: -200% center; }
        }
    </style>
</head>
<body>
    <div class="bg-logo">
        <img src="{% static 'crm/img/LZBJJ_White.png' %}" alt="" onerror="this.style.display='none'">
    </div>

    <div class="vignette"></div>
    <div class="scanlines"></div>

    <div class="bracket tl"></div>
    <div class="bracket tr"></div>
    <div class="bracket bl"></div>
    <div class="bracket br"></div>

    <div class="h-line top"></div>
    <div class="h-line bottom"></div>

    <div class="stage">
        <div class="phase-label phase-ready" id="timerLabel">READY</div>
        <div class="timer-digits" id="timerDisplay">00:00</div>
        <div class="round-info" id="roundInfo">ROUND &nbsp;<span>—</span>&nbsp;/&nbsp;<span>—</span></div>
    </div>

    <div class="status-bar">
        <div style="display:flex;align-items:center;">
            <span class="dot" id="statusDot"></span>
            <span class="label" id="statusLabel">SYNCING...</span>
        </div>
        <div class="brand">LZBJJ · FIGHT TIMER</div>
    </div>

    <script>
    (function () {
        const timerEl = document.getElementById('timerDisplay');
        const labelEl = document.getElementById('timerLabel');
        const roundEl = document.getElementById('roundInfo');
        const dotEl = document.getElementById('statusDot');
        const statEl = document.getElementById('statusLabel');
        const pollUrl = '{% url "timers:active_state" %}';

        function setStatus(text, live) {
            statEl.textContent = text;
            statEl.className = 'label' + (live ? ' live' : '');
            dotEl.className = 'dot' + (live ? ' live' : '');
        }

        function setReadyUI() {
            timerEl.textContent = '00:00';
            timerEl.className = 'timer-digits';
            labelEl.textContent = 'READY';
            labelEl.className = 'phase-label phase-ready';
            roundEl.innerHTML = 'ROUND &nbsp;<span>—</span>&nbsp;/&nbsp;<span>—</span>';
        }

        function parseDate(dateStr) {
            if (!dateStr) return null;
            const normalized = dateStr.replace(/\.(\d{1,3})\d*/, '.$1');
            const d = new Date(normalized);
            if (isNaN(d.getTime())) {
                return new Date(dateStr.split('.')[0]);
            }
            return d;
        }

        function getTimerStateAt(state, targetTime) {
            if (!state || state.status !== 'RUNNING' || !state.last_started_at) {
                return {
                    status: state ? state.status : 'READY',
                    current_state: state ? state.current_state : 'WORK',
                    current_round: state ? state.current_round : 1,
                    time_remaining: state ? state.time_remaining : 0
                };
            }

            const lastStarted = parseDate(state.last_started_at);
            if (!lastStarted || isNaN(lastStarted.getTime())) {
                return {
                    status: state.status,
                    current_state: state.current_state,
                    current_round: state.current_round,
                    time_remaining: state.time_remaining
                };
            }

            let elapsed = Math.floor((targetTime - lastStarted) / 1000);
            if (elapsed <= 0) {
                return {
                    status: state.status,
                    current_state: state.current_state,
                    current_round: state.current_round,
                    time_remaining: state.time_remaining
                };
            }

            let status = state.status;
            let current_state = state.current_state;
            let current_round = state.current_round;
            let time_remaining = state.time_remaining;

            while (elapsed > 0) {
                if (elapsed < time_remaining) {
                    time_remaining -= elapsed;
                    elapsed = 0;
                } else {
                    elapsed -= time_remaining;
                    if (current_state === 'WORK') {
                        if (current_round < state.rounds) {
                            current_state = 'REST';
                            time_remaining = state.interval;
                        } else {
                            status = 'DONE';
                            current_state = 'WORK';
                            time_remaining = 0;
                            elapsed = 0;
                        }
                    } else {
                        current_state = 'WORK';
                        current_round += 1;
                        time_remaining = state.duration;
                    }
                }
            }

            return {
                status,
                current_state,
                current_round,
                time_remaining
            };
        }

        function formatTime(seconds) {
            const safeSeconds = Math.max(0, Math.floor(seconds || 0));
            const m = Math.floor(safeSeconds / 60);
            const s = safeSeconds % 60;
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        let activeTimerState = null;
        let skewOffset = 0;
        let ablyConnected = false;

        function applyState(state) {
            updateState(state);
        }

        function updateState(state) {
            if (!state || !state.id) {
                activeTimerState = null;
                setReadyUI();
                setStatus('NO ACTIVE TIMER', false);
                return;
            }

            if (state.server_time) {
                const serverTime = new Date(state.server_time);
                skewOffset = serverTime.getTime() - Date.now();
            }
            activeTimerState = state;
            render();
        }

        function render() {
            if (!activeTimerState) return;

            const current = getTimerStateAt(activeTimerState, new Date(Date.now() + skewOffset));
            let displayTime = current.time_remaining;
            if (activeTimerState.direction === 'UP' && current.current_state === 'WORK') {
                displayTime = activeTimerState.duration - current.time_remaining;
            }

            let labelText = 'READY';
            let phase = 'ready';
            let warning = false;

            if (current.status === 'DONE') {
                labelText = 'DONE';
                phase = 'done';
            } else if (current.status === 'RUNNING' || current.status === 'PAUSED') {
                if (current.current_state === 'WORK') {
                    labelText = `WORK - Round ${current.current_round}/${activeTimerState.rounds}`;
                    phase = 'work';
                    warning = displayTime < 10;
                } else {
                    labelText = `REST - Round ${current.current_round}/${activeTimerState.rounds}`;
                    phase = 'rest';
                }
            } else if (activeTimerState.status === 'PAUSED') {
                labelText = 'PAUSED';
                phase = 'ready';
            }

            timerEl.textContent = formatTime(displayTime);
            timerEl.className = 'timer-digits';
            labelEl.textContent = labelText.toUpperCase();
            labelEl.className = 'phase-label phase-' + phase;

            if (warning) {
                timerEl.classList.add('digits-warning');
            } else if (phase === 'work') {
                timerEl.classList.add('digits-work');
            } else if (phase === 'rest') {
                timerEl.classList.add('digits-rest');
            } else if (phase === 'done') {
                timerEl.classList.add('digits-done');
            }

            const roundText = `ROUND &nbsp;<span>${current.current_round}</span>&nbsp;/&nbsp;<span>${activeTimerState.rounds}</span>`;
            roundEl.innerHTML = roundText;
            
            if (ablyConnected) {
                setStatus('LIVE · SYNCED', true);
            } else {
                setStatus('LIVE · POLLING', true);
            }
        }

        function tick() {
            if (!activeTimerState || activeTimerState.status !== 'RUNNING') return;
            render();
        }

        function fetchTimerState() {
            fetch(pollUrl, { credentials: 'same-origin' })
                .then(response => {
                    if (!response.ok) throw new Error('Unable to load timer');
                    return response.json();
                })
                .then(data => {
                    if (data && data.active === false) {
                        updateState(null);
                        return;
                    }
                    updateState(data);
                })
                .catch(() => {
                    setStatus('SYNC ERROR', false);
                });
        }

        // Initialize Ably if available
        try {
            if (typeof Ably !== 'undefined') {
                const ablyInstance = new Ably.Realtime.Promise({
                    authUrl: "{% url 'notifications:ably_token' %}",
                });
                
                ablyInstance.connection.on('connected', () => {
                    ablyConnected = true;
                    if (activeTimerState) setStatus('LIVE · SYNCED', true);
                });
                
                ablyInstance.connection.on('disconnected', () => {
                    ablyConnected = false;
                    if (activeTimerState) setStatus('LIVE · POLLING', true);
                });
                
                ablyInstance.connection.on('failed', () => {
                    ablyConnected = false;
                    if (activeTimerState) setStatus('LIVE · POLLING', true);
                });

                const channelName = "user-{{ request.user.id }}-timer";
                const channel = ablyInstance.channels.get(channelName);
                channel.subscribe('update', (msg) => {
                    console.log("Ably received TV timer sync update", msg.data);
                    updateState(msg.data);
                });
            }
        } catch (e) {
            console.error("Ably initialization failed on TV page:", e);
        }

        fetchTimerState();
        setInterval(fetchTimerState, 5000); // 5s fallback polling
        setInterval(tick, 100); // 100ms local precise ticking
    })();
    </script>
</body>
</html>
